[project]
name = "city-planner-geo"
version = "0.1.0"
description = "Sistema de Planeamento de Cidades Geolocalizadas"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.13"
dependencies = ["fastapi (>=0.115,<1)", "uvicorn[standard] (>=0.54.0,<0.55.0)", "streamlit (>=1.66.1,<2.0.0)", "supabase (>=2.8)", "pydantic (>=2.8)", "pydantic-settings (>=2.16.2,<3.0.0)", "python-dotenv (>=1.2.4,<2.0.0)", "pynitefea (>=3.2.1,<4.0.0)", "celery (>=5.6.3,<6.0.0)", "redis (>=8.1.0,<9.0.0)", "streamlit-folium (>=0.27.4,<0.28.0)", "folium (>=0.20.0,<0.21.0)", "jinja2 (>=3.1.6,<4.0.0)", "weasyprint (>=70.0,<71.0)", "cachetools (>=7.2.7,<8.0.0)", "shapely (>=2.2.0,<3.0.0)", "pyproj (>=3.6,<3.8)", "httpx (>=0.28.1,<0.29.0)", "requests (>=2.34.2,<3.0.0)", "pandas (>=3.1.0,<4.0.0)", "pyjwt[crypto] (>=2.15.1,<3.0.0)", "sentry-sdk (>=2.0,<3.0)"]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
ruff = ">=0.6"
black = ">=24.8"
mypy = ">=1.11"
pytest = ">=8.3"
pytest-cov = ">=5.0"
pre-commit = ">=3.8"
pytest-asyncio = "^1.4.1"
types-shapely = "^2.1.0.20261030"
types-cachetools = "^7.0.0.20260713"
types-requests = "^2.33.0.20261030"
pandas-stubs = "^3.1.0.261029"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", "models"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle + pyflakes (inclui E722: except genérico)
    "I",             # imports ordenados
    "B",             # bugbear
    "UP",            # pyupgrade
    "N",             # nomes
    "C90",           # complexidade
    "S",             # segurança (eval/exec, etc.)
    "T20",           # proíbe print()
    "D",             # docstrings
]
ignore = ["D100", "D104", "D203", "D213"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101", "S105", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["backend", "frontend", "shared"]
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Sem stubs nem py.typed.
module = ["celery.*", "weasyprint.*", "streamlit_folium.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# O folium não anota os construtores dos plugins.
module = ["frontend.components.map_selector"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=backend --cov=frontend --cov=shared --cov-report=term-missing --cov-fail-under=70"

[tool.coverage.run]
branch = true
