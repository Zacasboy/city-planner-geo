[project]
name = "city-planner-geo"
version = "0.1.0"
description = "Sistema de Planeamento de Cidades Geolocalizadas"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.13"
dependencies = []

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
ruff = ">=0.6"
black = ">=24.8"
mypy = ">=1.11"
pytest = ">=8.3"
pytest-cov = ">=5.0"
pre-commit = ">=3.8"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", "models"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle + pyflakes (inclui E722: except genérico)
    "I",             # imports ordenados
    "B",             # bugbear
    "UP",            # pyupgrade
    "N",             # nomes
    "C90",           # complexidade
    "S",             # segurança (eval/exec, etc.)
    "T20",           # proíbe print()
    "D",             # docstrings
]
ignore = ["D100", "D104", "D203", "D213"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["backend", "frontend", "shared"]
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=backend --cov=frontend --cov=shared --cov-report=term-missing --cov-fail-under=70"

[tool.coverage.run]
branch = true
