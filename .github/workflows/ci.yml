name: CI

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Poetry tem de existir antes do setup-python para a cache funcionar
      - name: Install Poetry
        run: pipx install poetry

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: poetry

      - name: Install dependencies
        run: poetry install

      - name: Lint (ruff)
        run: poetry run ruff check .

      - name: Format (black)
        run: poetry run black --check .

      - name: Types (mypy)
        run: poetry run mypy

      - name: Tests (pytest)
        run: poetry run pytest
